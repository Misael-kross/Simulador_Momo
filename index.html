<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#efefef"><title>Simuladores</title>
<style>
:root{color-scheme:light;--bg:#efefef;--fg:#242424;--muted:#626262;--line:#bdbdbd;--card:#fafafa;--active:#333;--correct:#e0e8e0;--wrong:#eee0e0}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 Arial,Helvetica,sans-serif}header,main{width:min(900px,calc(100% - 32px));margin:auto}header{padding:28px 0 14px;border-bottom:1px solid var(--line)}h1{font-size:24px;letter-spacing:.01em;margin:0;font-weight:700}main{padding:22px 0 80px}h2{font-size:19px;margin:0 0 16px}h3{font-size:17px;margin:0 0 10px}p{margin:8px 0 14px}.muted,.meta{color:var(--muted)}.meta{font-size:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.tile,.question{background:var(--card);border:1px solid var(--line);border-radius:2px}.tile{padding:18px;text-align:left;cursor:pointer;font:inherit;color:inherit;min-height:84px}.tile:hover,.tile:focus-visible{border-color:#555;background:#e4e4e4}.tile strong{display:block;font-size:17px}.tile small{color:var(--muted)}button{font:inherit;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.btn{background:#333;color:white;border:1px solid #333;border-radius:2px;padding:10px 16px}.btn.secondary{color:#242424;background:#f7f7f7;border-color:#aaa}.btn:hover:not(:disabled){filter:brightness(.9)}.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:22px}.toolbar .right{margin-left:auto}.question{padding:22px;margin:0 0 18px}.question p{white-space:pre-line}.options{display:grid;gap:9px;margin-top:15px}.option{display:flex;gap:10px;align-items:flex-start;background:#f4f4f4;border:1px solid #c5c5c5;padding:12px;cursor:pointer}.option:has(input:checked){border-color:#555;background:#e2e2e2}.option input{margin-top:4px;accent-color:#333}.option.correct{background:var(--correct);border-color:#7d947d}.option.incorrect{background:var(--wrong);border-color:#ad8585}.content-image{display:block;max-width:100%;max-height:420px;object-fit:contain;margin:12px 0}.option img{max-width:min(100%,300px);max-height:220px;object-fit:contain}.results{border:1px solid var(--line);padding:18px;background:var(--card);margin-bottom:20px}.feedback{border-top:1px solid var(--line);margin-top:14px;padding-top:10px}.hidden{display:none!important}.state{margin-top:18px;color:var(--muted)}.progress{margin-bottom:16px;color:var(--muted);font-size:14px}.tag{font-size:12px;color:#666;text-transform:uppercase;letter-spacing:.05em}.answers-title{margin-bottom:12px}@media(max-width:600px){.question{padding:15px}main{padding-top:18px}header{padding-top:20px}.toolbar .right{margin-left:0}}
</style>
</head>
<body>
<header><h1>Simuladores</h1></header>
<main><div id="app" aria-live="polite"><p class="state">Cargando materias…</p></div></main>
<script>
'use strict';
/* GitHub Pages no permite listar directorios; la API pública de GitHub descubre los JSON de examenes/.
   También se admite un listado manual opcional en examenes/indice.json: ["tercer_ano/.../examen.json"]. */
const app=document.getElementById('app');
const state={items:[],exam:null,choices:{},finished:false,started:0,timer:null,seconds:0,view:'catalog'};
const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nice=s=>String(s||'').replace(/[_-]+/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
const pathEncode=path=>path.split('/').map(encodeURIComponent).join('/');
const jsonFile=p=>/\.json$/i.test(p)&&!/(^|\/)(index|indice|manifest|catalogo)\.json$/i.test(p);
function isExamPath(p){return p.startsWith('examenes/')&&jsonFile(p)}
async function discover(){
 const match=location.pathname.match(/^\/([^/]+)(?:\/|$)/);
 const repo=match?.[1]||'Simulador_Momo';
 const owner=location.hostname.endsWith('.github.io')?location.hostname.split('.')[0]:'Misael-kross';
 let found=[];let errors=[];
 // Preferir índice local si existe; formato: lista de rutas relativas a examenes/.
 try{const r=await fetch('examenes/indice.json',{cache:'no-store'});if(r.ok){const a=await r.json();if(Array.isArray(a)){found=a.map(x=>typeof x==='string'?x:x?.ruta||x?.archivo||x?.path).filter(Boolean).map(p=>p.replace(/^\/?(?:examenes\/)?/,'examenes/')).filter(isExamPath)}}}catch(e){errors.push(e)}
 if(!found.length){
  for(const branch of ['main','master']){
   try{const r=await fetch(`https://api.github.com/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/git/trees/${branch}?recursive=1`,{headers:{Accept:'application/vnd.github+json'}});if(!r.ok)continue;const data=await r.json();found=(data.tree||[]).filter(f=>f.type==='blob'&&isExamPath(f.path)).map(f=>f.path);if(found.length)break;if(data.truncated)throw Error('El listado de archivos de GitHub está incompleto.')}catch(e){errors.push(e)}
  }
 }
 found=[...new Set(found)].sort((a,b)=>a.localeCompare(b,'es',{numeric:true}));
 if(!found.length)throw Error('No se detectaron archivos JSON en examenes/. Comprueba que la carpeta exista en la rama publicada y que el repositorio sea público. Si la API está limitada, crea examenes/indice.json con una lista de rutas.');
 return found.map(path=>{const segments=path.split('/');const file=segments.at(-1);const year=segments.length>2?segments[1]:'General';const subject=segments.length>3?segments.slice(2,-1).join(' / '):'General';return {path,year,subject,name:nice(file.replace(/\.json$/i,'').replace(/^examen[_\s-]*/i,'Examen '))}});
}
function group(items,key){const out=new Map();items.forEach(i=>{const k=i[key];if(!out.has(k))out.set(k,[]);out.get(k).push(i)});return out}
function headerBack(cb){const bar=document.createElement('div');bar.className='toolbar';const b=document.createElement('button');b.className='btn secondary';b.textContent='Volver';b.onclick=cb;bar.append(b);return bar}
function renderCatalog(){stopTimer();state.view='catalog';app.innerHTML='<h2>Materias</h2>';if(!state.items.length)return;const groups=group(state.items,'year');for(const [year,entries] of groups){const title=document.createElement('h3');title.textContent=nice(year);app.append(title);const grid=document.createElement('div');grid.className='grid';for(const [subject,exams] of group(entries,'subject')){const b=document.createElement('button');b.className='tile';const a=document.createElement('strong');a.textContent=nice(subject);const small=document.createElement('small');small.textContent=exams.length===1?'1 simulador':`${exams.length} simuladores`;b.append(a,small);b.onclick=()=>renderList(year,subject);grid.append(b)}app.append(grid)}}
function renderList(year,subject){stopTimer();state.view='list';app.replaceChildren(headerBack(renderCatalog));const h=document.createElement('h2');h.textContent=nice(subject);app.append(h);const grid=document.createElement('div');grid.className='grid';for(const item of state.items.filter(i=>i.year===year&&i.subject===subject)){const b=document.createElement('button');b.className='tile';b.innerHTML=`<strong>${escapeHTML(item.name)}</strong>`;b.onclick=()=>loadExam(item,year,subject);grid.append(b)}app.append(grid)}
function getText(o,keys,def=''){for(const k of keys)if(o&&o[k]!==undefined&&o[k]!==null&&o[k]!=='')return o[k];return def}
function textOf(v){if(typeof v==='string'||typeof v==='number')return String(v);if(v&&typeof v==='object')return String(getText(v,['texto','text','contenido','enunciado','descripcion','pregunta','valor','label','opcion'],''));return ''}
function normalizedOptions(q){let input=getText(q,['opciones','alternativas','respuestas','choices','options'],[]);let entries=Array.isArray(input)?input.map((v,i)=>[String.fromCharCode(65+i),v]):Object.entries(input||{});return entries.map(([key,v],i)=>({key:String(key).toUpperCase(),text:textOf(v),img:getText(v,['imagen','image','url_imagen','image_url'],''),correct:v&&typeof v==='object'?getText(v,['correcta','es_correcta','isCorrect'],false):false}));}
function normalize(data,item){const raw=Array.isArray(data)?data:getText(data,['preguntas','questions','reactivos','items'],[]);if(!Array.isArray(raw)||!raw.length)throw Error('El archivo no contiene un arreglo de preguntas válido.');const cfg=getText(data,['configuracion','config','settings'],{});const metadata=getText(data,['metadatos','metadata'],{});const duration=Number(getText(cfg,['duracion','duracion_minutos','tiempo_limite','tiempo'],getText(data,['duracion','duracion_minutos'],90)));return {title:textOf(getText(metadata,['nombre','titulo'],getText(data,['nombre','titulo'],item.name))),duration:Number.isFinite(duration)&&duration>0?duration:90,path:item.path,questions:raw.map((q,i)=>({num:i+1,prompt:textOf(getText(q,['contenido','pregunta','enunciado','texto','question'],'')),image:getText(q,['imagen','image','imagen_pregunta','image_url'],''),options:normalizedOptions(q),answer:getText(q,['respuesta_correcta','respuesta','correcta','correct_answer','correctAnswer'],''),explanation:textOf(getText(q,['explicacion','justificacion','explanation','retroalimentacion'],''))}))};}
async function loadExam(item,year,subject){state.view='loading';app.replaceChildren(headerBack(()=>renderList(year,subject)));const p=document.createElement('p');p.className='state';p.textContent='Cargando simulador…';app.append(p);try{const r=await fetch(pathEncode(item.path),{cache:'no-store'});if(!r.ok)throw Error(`No se encontró el archivo (${r.status}).`);state.exam=normalize(await r.json(),item);state.choices={};state.finished=false;state.seconds=0;state.returnTo=()=>renderList(year,subject);renderExam();}catch(e){p.textContent=`No se pudo cargar este examen: ${e.message}`}}
function img(src,path){if(!src)return null;const im=document.createElement('img');im.className='content-image';im.alt='Imagen del reactivo';const val=String(src).trim();im.src=/^(https?:|data:|\/)/i.test(val)?val:(val.startsWith('examenes/')?pathEncode(val):pathEncode(path.slice(0,path.lastIndexOf('/')+1)+val));im.loading='lazy';return im;}
function answerIndex(q){const a=q.answer;if(typeof a==='number'&&a>=0&&a<q.options.length)return a;let token=String(a??'').trim();const m=token.match(/^([A-Z])(?:[).\s:]|$)/i);if(m)token=m[1];const idx=q.options.findIndex(o=>o.key.toUpperCase()===token.toUpperCase()||o.text.trim().toLowerCase()===token.toLowerCase());return idx>=0?idx:q.options.findIndex(o=>o.correct===true);}
function stopTimer(){if(state.timer)clearInterval(state.timer);state.timer=null}
function secondsLabel(s){return `${Math.floor(s/60).toString().padStart(2,'0')}:${(s%60).toString().padStart(2,'0')}`}
function startTimer(){stopTimer();state.started=Date.now()-state.seconds*1000;state.timer=setInterval(()=>{if(state.view!=='exam')return;state.seconds=Math.floor((Date.now()-state.started)/1000);const timer=document.getElementById('timer');if(timer)timer.textContent=secondsLabel(Math.max(0,state.exam.duration*60-state.seconds));if(state.seconds>=state.exam.duration*60){stopTimer();finish(true)}},1000)}
function renderExam(){const e=state.exam;state.view='exam';app.replaceChildren();const nav=document.createElement('div');nav.className='toolbar';const back=document.createElement('button');back.className='btn secondary';back.textContent='Volver';back.onclick=()=>{if(state.finished||confirm('¿Salir del simulador? Se perderán las respuestas.'))state.returnTo()};nav.append(back);const timer=document.createElement('span');timer.className='meta right';timer.id='timer';timer.textContent=secondsLabel(Math.max(0,e.duration*60-state.seconds));nav.append(timer);app.append(nav);const h=document.createElement('h2');h.textContent=e.title;app.append(h);const prog=document.createElement('div');prog.className='progress';prog.id='progress';app.append(prog);e.questions.forEach((q,i)=>{const article=document.createElement('section');article.className='question';const label=document.createElement('div');label.className='tag';label.textContent=`Pregunta ${i+1}`;article.append(label);const p=document.createElement('p');p.textContent=q.prompt;article.append(p);const photo=img(q.image,e.path);if(photo)article.append(photo);const opts=document.createElement('div');opts.className='options';if(!q.options.length){const no=document.createElement('p');no.textContent='Sin opciones';opts.append(no)}q.options.forEach((o,j)=>{const label=document.createElement('label');label.className='option';const input=document.createElement('input');input.type='radio';input.name=`q${i}`;input.value=String(j);input.checked=state.choices[i]===j;input.disabled=state.finished;input.onchange=()=>{state.choices[i]=j;updateProgress()};const content=document.createElement('span');content.textContent=`${o.key}. ${o.text}`;const photo=img(o.img,e.path);if(photo)content.append(photo);label.append(input,content);if(state.finished){const right=answerIndex(q);if(j===right)label.classList.add('correct');else if(j===state.choices[i])label.classList.add('incorrect')}opts.append(label)});article.append(opts);if(state.finished){const f=document.createElement('div');f.className='feedback';const right=answerIndex(q);const selected=state.choices[i];const status=document.createElement('strong');status.textContent=right<0?'Respuesta no identificada':selected===right?'Correcta':'Incorrecta';f.append(status);const info=document.createElement('p');info.textContent=`Tu respuesta: ${selected===undefined?'Sin responder':q.options[selected]?.key||'-'}. Respuesta correcta: ${right<0?'No identificada':q.options[right]?.key||'-'}.`;f.append(info);if(q.explanation){const explanation=document.createElement('p');explanation.textContent=q.explanation;f.append(explanation)}article.append(f)}app.append(article)});const end=document.createElement('div');end.className='toolbar';if(!state.finished){const b=document.createElement('button');b.className='btn';b.textContent='Finalizar';b.onclick=()=>{if(confirm('¿Finalizar y revisar respuestas?'))finish(false)};end.append(b)}else{const b=document.createElement('button');b.className='btn secondary';b.textContent='Volver a simuladores';b.onclick=state.returnTo;end.append(b)}app.append(end);updateProgress();if(state.finished)showResult();else startTimer()}
function updateProgress(){const p=document.getElementById('progress');if(p&&state.exam)p.textContent=`${Object.keys(state.choices).length} de ${state.exam.questions.length} respondidas`}
function finish(expired){if(state.finished)return;state.finished=true;stopTimer();renderExam();if(expired){const notice=document.createElement('p');notice.className='meta';notice.textContent='Tiempo terminado.';app.insertBefore(notice,app.children[1])}window.scrollTo({top:0,behavior:'smooth'})}
function showResult(){const questions=state.exam.questions;const evaluable=questions.filter(q=>answerIndex(q)>=0).length;const hits=questions.reduce((n,q,i)=>n+(answerIndex(q)>=0&&state.choices[i]===answerIndex(q)?1:0),0);const result=document.createElement('div');result.className='results';result.innerHTML=`<h3>Resultados</h3><p>${hits} correctas de ${evaluable} evaluables.</p><p class="meta">${questions.length-Object.keys(state.choices).length} sin responder.</p>`;app.insertBefore(result,app.children[3]||null)}
window.addEventListener('beforeunload',event=>{if(state.view==='exam'&&!state.finished){event.preventDefault();event.returnValue=''}});
(async()=>{try{state.items=await discover();renderCatalog()}catch(e){app.innerHTML=`<h2>Simuladores</h2><p class="state">${escapeHTML(e.message)}</p>`}})();
</script>
</body></html>
